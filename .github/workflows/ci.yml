name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel an older run for the same branch/PR when a new commit is pushed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, typecheck, Jest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Unit tests (Jest)
        run: npm run test:ci
        env:
          JEST_JUNIT_OUTPUT_DIR: reports
          JEST_JUNIT_OUTPUT_NAME: junit.xml
          JEST_JUNIT_CLASSNAME: "{classname}"
          JEST_JUNIT_TITLE: "{title}"

      - name: Test results summary
        if: always()
        run: python3 ../.github/scripts/junit_summary.py reports/junit.xml "Frontend tests (Jest)"

      - name: Upload test report and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: |
            frontend/reports/
            frontend/coverage/
          if-no-files-found: ignore

  backend:
    name: Backend (Ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (Ruff)
        run: ruff check . --output-format=github

      - name: Type check (mypy)
        run: mypy .

      - name: Unit tests (pytest)
        run: pytest --junitxml=reports/junit.xml

      - name: Test results summary
        if: always()
        run: python3 ../.github/scripts/junit_summary.py reports/junit.xml "Backend tests (pytest)"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/reports/
          if-no-files-found: ignore

  # One required check for branch protection: passes only if both jobs pass.
  ci-status:
    name: CI status
    if: always()
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          echo "frontend: ${{ needs.frontend.result }}"
          echo "backend:  ${{ needs.backend.result }}"
          if [ "${{ needs.frontend.result }}" != "success" ] || [ "${{ needs.backend.result }}" != "success" ]; then
            echo "::error::CI failed. Open the failed job above for details."
            exit 1
          fi
          echo "All checks passed."